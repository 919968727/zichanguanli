<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>离线扫码 · {{ app_config.name }}</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
                 "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
  body {
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; padding-bottom: 96px;
  }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, #1e293b, #334155);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .topbar .icon { font-size: 26px; flex-shrink: 0; }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: rgba(99,102,241,.2); color: #a5b4fc;
    font-weight: 600; flex-shrink: 0;
  }

  .desc {
    padding: 10px 16px; background: #1e293b;
    border-bottom: 1px solid #334155;
    font-size: 12px; color: #94a3b8; line-height: 1.6;
  }

  .container { padding: 16px; max-width: 720px; margin: 0 auto; }

  .section-title {
    font-size: 12px; color: #94a3b8; font-weight: 600;
    letter-spacing: .5px; text-transform: uppercase;
    margin: 20px 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .count {
    color: #6366f1; font-size: 12px; font-weight: 700;
    text-transform: none; letter-spacing: 0;
  }

  .scan-modes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .scan-mode-btn {
    padding: 14px 12px;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 10px;
    color: #e2e8f0;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .scan-mode-btn:hover:not(:disabled) {
    border-color: #6366f1;
    background: linear-gradient(135deg, rgba(99,102,241,.1), rgba(139,92,246,.1));
  }
  .scan-mode-btn:disabled {
    opacity: .35;
    cursor: not-allowed;
  }
  .scan-mode-btn .icon { font-size: 18px; }

  .scan-input {
    width: 100%; padding: 14px 16px; font-size: 16px;
    background: #1e293b; border: 2px solid #334155; border-radius: 10px;
    color: #f1f5f9; font-family: inherit; outline: none;
    transition: border-color .15s;
  }
  .scan-input:focus { border-color: #6366f1; }
  .scan-hint {
    font-size: 12px; color: #64748b; margin-top: 6px;
  }

  .big-scan-btn {
    width: 100%; padding: 14px; font-size: 15px; font-weight: 600;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; border: none; border-radius: 10px; cursor: pointer;
    margin-top: 12px;
    box-shadow: 0 6px 20px rgba(99,102,241,.35);
  }
  .big-scan-btn:hover { filter: brightness(1.05); }

  .result-card {
    background: #1e293b; border: 2px solid #6366f1; border-radius: 12px;
    padding: 16px; margin-top: 14px;
  }
  .result-gid {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px; color: #94a3b8;
    word-break: break-all; padding: 6px 0;
  }
  .action-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .action-btn {
    flex: 1 1 120px; padding: 12px; font-size: 14px; font-weight: 600;
    background: #6366f1; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; transition: background .15s;
  }
  .action-btn:hover { background: #4f46e5; }
  .action-btn.danger { background: #ef4444; }
  .action-btn.danger:hover { background: #dc2626; }

  .queue-list {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .queue-item {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .queue-item-main { flex: 1; min-width: 0; }
  .queue-item-title { font-weight: 600; }
  .queue-item-meta {
    font-size: 11px; color: #94a3b8; margin-top: 2px;
    word-break: break-all;
  }
  .queue-item-del {
    width: 30px; height: 30px; border-radius: 50%;
    background: transparent; color: #ef4444;
    border: 1px solid #334155; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .queue-item-del:hover { background: rgba(239,68,68,.15); }

  .empty-state {
    text-align: center; padding: 32px 16px;
    color: #64748b; font-size: 13px; line-height: 1.6;
  }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: #1e293b; border-top: 1px solid #334155;
    padding: 12px 16px;
    display: flex; gap: 8px; align-items: center;
    box-shadow: 0 -2px 8px rgba(0,0,0,.3);
  }
  .bottom-bar .stats {
    font-size: 12px; color: #94a3b8; flex: 1; min-width: 0;
  }
  .bottom-bar button {
    padding: 10px 16px; font-size: 13px; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer;
    white-space: nowrap;
  }
  .btn-secondary { background: #334155; color: #f1f5f9; }
  .btn-secondary:hover { background: #475569; }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-primary:disabled, .btn-secondary:disabled {
    opacity: .5; cursor: not-allowed;
  }

  .toast {
    position: fixed; top: 90px; left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: #10b981; color: #fff;
    padding: 10px 18px; border-radius: 8px;
    font-size: 13px; font-weight: 600; z-index: 9999;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #ef4444; }

  .notice {
    margin: 0 0 16px; padding: 12px 14px;
    background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3);
    border-radius: 10px; color: #fbbf24; font-size: 12.5px; line-height: 1.7;
  }
  /* ★ 新增：环境信息条 */
  .env-bar {
    margin: 0 0 12px; padding: 8px 12px;
    border-radius: 8px; font-size: 12px; line-height: 1.6;
    word-break: break-all;
  }
  .env-bar.ok { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
  .env-bar.warn { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); color: #fbbf24; }
  .env-bar.danger { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
  .env-bar code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }

  /* ============================================================
     摄像头扫码遮罩
     ============================================================ */
  .cam-modal {
    position: fixed; inset: 0; z-index: 5000;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    animation: camFadeIn .18s ease;
  }
  .cam-modal.hidden { display: none !important; }
  @keyframes camFadeIn { from { opacity: 0; } to { opacity: 1; } }

  .cam-video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    background: #000;
  }
  .cam-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(75vw, 340px);
    height: min(75vw, 340px);
    border: 2px dashed rgba(99,102,241,.7);
    border-radius: 16px;
    pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.35);
  }
  .cam-frame::before,
  .cam-frame::after {
    content: '';
    position: absolute;
    width: 26px; height: 26px;
    border: 3px solid #6366f1;
  }
  .cam-frame::before {
    top: -2px; left: -2px;
    border-right: none; border-bottom: none;
    border-top-left-radius: 16px;
  }
  .cam-frame::after {
    bottom: -2px; right: -2px;
    border-left: none; border-top: none;
    border-bottom-right-radius: 16px;
  }
  .cam-hint {
    position: absolute;
    bottom: calc(50% - min(37.5vw, 170px) - 50px);
    left: 50%; transform: translateX(-50%);
    color: #f1f5f9;
    font-size: 14px;
    text-align: center;
    background: rgba(0,0,0,.5);
    padding: 8px 16px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .cam-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    color: #fff;
    border: 1px solid rgba(255,255,255,.2);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center; justify-content: center;
    z-index: 1;
  }
  .cam-close:hover { background: rgba(239,68,68,.85); }

  .cam-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    color: #e2e8f0;
    background: #0f172a;
  }
  .cam-fallback.hidden { display: none !important; }
  .cam-fallback .fb-icon { font-size: 48px; margin-bottom: 16px; }
  .cam-fallback .fb-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .cam-fallback .fb-desc { font-size: 13px; color: #94a3b8; line-height: 1.7; max-width: 380px; }
  .cam-fallback .fb-desc code { font-family: ui-monospace, monospace; font-size: 11px; color: #cbd5e1; }
  .cam-fallback .fb-actions {
    margin-top: 22px;
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .cam-fallback .fb-btn {
    padding: 11px 22px;
    background: #6366f1; color: #fff;
    border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .cam-fallback .fb-btn.outline {
    background: transparent;
    border: 1px solid #475569;
    color: #cbd5e1;
  }
  .cam-fallback .fb-btn.outline:hover { background: #1e293b; }
</style>
</head>
<body>

<header class="topbar">
  <span class="icon">{{ app_config.icon }}</span>
  <h1>{{ app_config.name }} · 离线扫码</h1>
  <span class="badge">OFFLINE</span>
</header>

{% if app_config.description %}
<div class="desc">{{ app_config.description }}</div>
{% endif %}

<div class="container">

  <!-- ★ 环境信息条：打开方式 / 是否 secure context -->
  <div id="envBar" class="env-bar"></div>

  <div class="notice">
    📴 本页面完全离线运行，不联网、不登录。<br>
    扫码后点「导出 JSON」把文件拷回在线终端 → 在「离线数据回传」页登录上传即可。
  </div>

  <div class="section-title">① 选择扫码方式</div>

  <div class="scan-modes">
    <button id="btnCamera" class="scan-mode-btn" type="button">
      <span class="icon">📷</span> 摄像头扫码
    </button>
    <button id="btnPhoto" class="scan-mode-btn" type="button">
      <span class="icon">📸</span> 拍照识别
    </button>
  </div>

  <input id="scanInput" class="scan-input" type="text" autocomplete="off"
         placeholder="或用扫码枪扫描，回车提交">
  <div class="scan-hint">扫码枪会自动回车提交；也可手动粘贴后点「确认」。</div>
  <button class="big-scan-btn" id="btnSubmitScan">确认</button>

  <input id="photoInput" type="file" accept="image/*" capture="environment"
         style="display:none;">

  <div id="resultCard" class="result-card" style="display:none;">
    <div style="font-size:13px; color:#94a3b8;">已识别二维码</div>
    <div class="result-gid" id="resultGid"></div>
    <div style="margin-top:12px; font-size:13px; font-weight:600;">选择操作：</div>
    <div class="action-buttons" id="actionButtons"></div>
  </div>

  <div class="section-title">
    <span>② 本地待上传</span>
    <span class="count" id="queueCount">0</span>
  </div>
  <ul class="queue-list" id="queueList">
    <li class="empty-state" id="queueEmpty">暂无记录</li>
  </ul>

</div>

<div class="bottom-bar">
  <div class="stats" id="statsText">0 条待上传</div>
  <button class="btn-secondary" id="btnClear">清空</button>
  <button class="btn-primary" id="btnExport">导出 JSON</button>
</div>

<div class="toast" id="toast"></div>

<!-- ★ 摄像头扫码遮罩 -->
<div id="camModal" class="cam-modal hidden">
  <video id="camVideo" class="cam-video" playsinline autoplay muted></video>
  <canvas id="camCanvas" style="display:none;"></canvas>
  <div class="cam-frame"></div>
  <div class="cam-hint">将二维码对准取景框</div>
  <button id="camClose" class="cam-close" type="button">✕</button>

  <div id="camFallback" class="cam-fallback hidden">
    <div class="fb-icon" id="camFallbackIcon">🚫</div>
    <div class="fb-title" id="camFallbackTitle">摄像头不可用</div>
    <div class="fb-desc" id="camFallbackDesc"></div>
    <div class="fb-actions">
      <button id="camRetryBtn" class="fb-btn outline" type="button">重试摄像头</button>
      <button id="camFallbackPhoto" class="fb-btn" type="button">📸 改用拍照识别</button>
    </div>
  </div>
</div>

<script>
  window.OFFLINE_APP = {{ app_config|tojson }};
</script>

<script>
{{ jsqr_code|safe }}
</script>

<script>
(function () {
  'use strict';

  var APP = window.OFFLINE_APP || {};
  var APP_ID = APP.app_id || 'unknown';

  var KEY_QUEUE = 'offline_' + APP_ID + '_queue';
  var KEY_BATCH = 'offline_' + APP_ID + '_batch';

  var HAS_JSQR = (typeof jsQR !== 'undefined');

  var state = {
    queue: [],
    batchId: null,
    currentGid: null,
    camStream: null,
    camDecoding: false,
    photoDecoding: false,
  };

  var $ = function (id) { return document.getElementById(id); };
  var envBar = $('envBar');
  var scanInput = $('scanInput');
  var btnSubmitScan = $('btnSubmitScan');
  var btnCamera = $('btnCamera');
  var btnPhoto = $('btnPhoto');
  var photoInput = $('photoInput');
  var resultCard = $('resultCard');
  var resultGid = $('resultGid');
  var actionButtons = $('actionButtons');
  var queueListEl = $('queueList');
  var queueEmpty = $('queueEmpty');
  var queueCount = $('queueCount');
  var statsText = $('statsText');
  var btnExport = $('btnExport');
  var btnClear = $('btnClear');
  var toastEl = $('toast');

  var camModal = $('camModal');
  var camVideo = $('camVideo');
  var camCanvas = $('camCanvas');
  var camClose = $('camClose');
  var camFallback = $('camFallback');
  var camFallbackIcon = $('camFallbackIcon');
  var camFallbackTitle = $('camFallbackTitle');
  var camFallbackDesc = $('camFallbackDesc');
  var camFallbackPhoto = $('camFallbackPhoto');
  var camRetryBtn = $('camRetryBtn');

  /* ---------- 工具 ---------- */
  function uuidv4() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      var v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
  function nowStr() {
    var d = new Date();
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { return false; }
  }
  function loadJSON(key, fallback) {
    try {
      var s = localStorage.getItem(key);
      if (!s) return fallback;
      return JSON.parse(s);
    } catch (e) { return fallback; }
  }

  var toastTimer;
  function showToast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2400);
  }

  /* ---------- 环境检测 & 顶部提示 ---------- */
  var env = { proto: location.protocol, isFile: false, isSecure: false, camPossible: false };
  (function detectEnv() {
    env.isFile = (location.protocol === 'file:');
    env.isSecure = (window.isSecureContext === true);
    // 摄像头要同时满足：secure context（file:// 一定不是 secure）+ 有 getUserMedia
    env.camPossible = !!env.isSecure &&
                      !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

    envBar.className = 'env-bar';
    if (env.isFile) {
      envBar.classList.add('danger');
      envBar.innerHTML =
        '🌐 打开方式：<code>file://</code>（本地文件）<br>' +
        '⚠ <b>浏览器禁止 file:// 使用摄像头</b>（即使弹出权限请求，最终也会拒绝）。<br>' +
        '请用 <b>「📸 拍照识别」</b> 或扫码枪。';
    } else if (!env.isSecure) {
      envBar.classList.add('danger');
      envBar.innerHTML =
        '🌐 打开方式：<code>' + esc(location.protocol) + '//' + esc(location.host) + '</code>（非安全上下文）<br>' +
        '⚠ 非 HTTPS / 非 localhost 页面禁止调用摄像头。请用「拍照识别」或扫码枪。';
    } else if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      envBar.classList.add('warn');
      envBar.innerHTML =
        '🌐 打开方式：<code>' + esc(location.protocol) + '//' + esc(location.host) + '</code><br>' +
        '⚠ 当前浏览器不支持摄像头 API。请用「拍照识别」或扫码枪。';
    } else {
      envBar.classList.add('ok');
      envBar.innerHTML =
        '🌐 打开方式：<code>' + esc(location.protocol) + '//' + esc(location.host) + '</code>（安全上下文）<br>' +
        '✅ 摄像头可用。请用后置摄像头对准二维码。';
    }
  })();

  /* ---------- 队列 ---------- */
  function loadQueue() {
    state.queue = loadJSON(KEY_QUEUE, []);
    if (!Array.isArray(state.queue)) state.queue = [];
  }
  function saveQueue() {
    if (!saveJSON(KEY_QUEUE, state.queue)) {
      showToast('本地存储写入失败（可能已满）', 'error');
    }
  }
  function renderQueue() {
    queueCount.textContent = String(state.queue.length);
    statsText.textContent = state.queue.length + ' 条待上传';
    btnExport.disabled = !state.queue.length;
    btnClear.disabled = !state.queue.length;

    var items = queueListEl.querySelectorAll('.queue-item');
    for (var i = 0; i < items.length; i++) items[i].remove();

    if (!state.queue.length) {
      queueEmpty.style.display = '';
      return;
    }
    queueEmpty.style.display = 'none';
    state.queue.forEach(function (rec, idx) {
      var li = document.createElement('li');
      li.className = 'queue-item';
      li.innerHTML =
        '<div class="queue-item-main">' +
          '<div class="queue-item-title">' + esc(rec.action_label || rec.action_id) + '</div>' +
          '<div class="queue-item-meta">' + esc(rec.gid) + '<br>' + esc(rec.scanned_at) + '</div>' +
        '</div>' +
        '<button class="queue-item-del" title="删除">×</button>';
      li.querySelector('.queue-item-del').addEventListener('click', function () {
        state.queue.splice(idx, 1);
        saveQueue();
        renderQueue();
      });
      queueListEl.appendChild(li);
    });
  }

  /* ---------- 批次 ---------- */
  function getOrCreateBatchId() {
    if (state.batchId) return state.batchId;
    var b = null;
    try { b = localStorage.getItem(KEY_BATCH); } catch (e) {}
    if (!b) {
      b = 'off-' + APP_ID + '-' + Date.now().toString(36) + '-' + uuidv4().slice(0, 8);
      try { localStorage.setItem(KEY_BATCH, b); } catch (e) {}
    }
    state.batchId = b;
    return b;
  }
  function resetBatchId() {
    try { localStorage.removeItem(KEY_BATCH); } catch (e) {}
    state.batchId = null;
  }

  /* ---------- 扫码结果处理 ---------- */
  function parseGid(gid) {
    var m = String(gid || '').trim().match(/^L(\d+)_([0-9a-f]{32})$/i);
    if (!m) return null;
    return { raw: m[0], lid: parseInt(m[1], 10), uuid: m[2].toLowerCase() };
  }

  function handleScannedGid(gid) {
    var parsed = parseGid(gid);
    if (!parsed) {
      showToast('二维码格式无效（应形如 L1_abc...）', 'error');
      return;
    }
    state.currentGid = parsed.raw;
    resultGid.textContent = parsed.raw;

    var actions = APP.actions || [];
    if (!actions.length) {
      actionButtons.innerHTML = '<div class="empty-state">该应用未配置操作</div>';
      resultCard.style.display = '';
      return;
    }
    actionButtons.innerHTML = '';
    actions.forEach(function (a) {
      var btn = document.createElement('button');
      btn.className = 'action-btn' + (a.danger ? ' danger' : '');
      btn.textContent = a.label || a.id;
      btn.addEventListener('click', function () { handleAction(a); });
      actionButtons.appendChild(btn);
    });
    resultCard.style.display = '';
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function handleAction(action) {
    if (action.confirm) {
      if (!confirm('确认执行「' + (action.label || action.id) + '」？')) return;
    }
    if (!state.currentGid) return;
    var rec = {
      client_uuid: uuidv4(),
      app_id: APP_ID,
      gid: state.currentGid,
      action_id: action.id,
      action_value: null,
      action_label: action.label || action.id,
      scanned_at: nowStr(),
    };
    state.queue.push(rec);
    saveQueue();
    renderQueue();
    showToast('已加入队列：' + rec.action_label);

    scanInput.value = '';
    resultCard.style.display = 'none';
    state.currentGid = null;
    setTimeout(function () { scanInput.focus(); }, 30);
  }

  /* ---------- 扫码枪 / 手动 ---------- */
  function submitScan() {
    var gid = scanInput.value.trim();
    if (!gid) { showToast('请输入二维码内容', 'error'); return; }
    handleScannedGid(gid);
  }

  /* ============================================================
   * 摄像头扫码 —— 前置检测 + 错误分类 + 重试
   * ============================================================ */
  function showCamFallback(opts) {
    state.camDecoding = false;
    camVideo.classList.add('hidden');
    camFallbackIcon.textContent = opts.icon || '🚫';
    camFallbackTitle.textContent = opts.title || '摄像头不可用';
    camFallbackDesc.innerHTML = opts.desc || '';
    camRetryBtn.style.display = opts.canRetry ? '' : 'none';
    camFallback.classList.remove('hidden');
    camModal.classList.remove('hidden');
  }

  function explainCamError(err) {
    // err 可能是 DOMException，也可能是 Error
    var name = (err && err.name) || 'UnknownError';
    var msg = (err && err.message) || '';

    if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
      return {
        icon: '🔒',
        title: '摄像头权限被拒绝',
        desc: '浏览器拒绝了摄像头访问。' +
              '若你刚点了「允许」，可能是 <b>file:// 协议</b> 或 <b>非 HTTPS 页面</b> 的限制（浏览器仍会拒绝）。<br>' +
              '请在地址栏右侧的<b>摄像头图标</b>里确认已允许本页面使用摄像头，然后点「重试」或改用「拍照识别」。',
        canRetry: true
      };
    }
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      return {
        icon: '📵',
        title: '未检测到摄像头',
        desc: '当前设备没有可用的摄像头。请改用「📸 拍照识别」或扫码枪。',
        canRetry: false
      };
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return {
        icon: '⛔',
        title: '摄像头被占用',
        desc: '摄像头正被其它应用占用（例如微信视频、其它浏览器标签页、录屏软件）。<br>' +
              '请关闭占用摄像头的应用，然后点「重试」。',
        canRetry: true
      };
    }
    if (name === 'OverconstrainedError' || name === 'ConstraintNotSatisfiedError') {
      return {
        icon: '⚙️',
        title: '摄像头参数不支持',
        desc: '设备摄像头不支持所需的参数（例如后置摄像头）。点「重试」会用默认摄像头重新尝试。',
        canRetry: true
      };
    }
    if (name === 'AbortError') {
      return {
        icon: '⏸',
        title: '摄像头启动被中断',
        desc: '请点「重试」再试一次。',
        canRetry: true
      };
    }
    return {
      icon: '🚫',
      title: '摄像头不可用',
      desc: '错误：<code>' + esc(name) + '</code>' +
            (msg ? '<br>' + esc(msg) : '') +
            '<br>请改用「📸 拍照识别」或扫码枪。',
      canRetry: true
    };
  }

  async function startCamera() {
    if (state.camStream) return;

    // ---- 1) 前置硬检测：不满足就不再弹权限请求 ----
    if (env.isFile) {
      showCamFallback({
        icon: '📄',
        title: 'file:// 下摄像头不可用',
        desc: '浏览器安全策略禁止 <code>file://</code> 页面使用摄像头。' +
              '即使弹出权限请求，最终也会被浏览器拒绝。<br>' +
              '请改用 <b>「📸 拍照识别」</b> 或扫码枪。',
        canRetry: false
      });
      return;
    }
    if (!env.isSecure) {
      showCamFallback({
        icon: '🌐',
        title: '当前页面非安全上下文',
        desc: '摄像头只能在 <b>HTTPS</b> 或 <b>localhost</b> 页面使用。' +
              '当前地址是 <code>' + esc(location.protocol) + '//' + esc(location.host) + '</code>。<br>' +
              '请改用「📸 拍照识别」或扫码枪。',
        canRetry: false
      });
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showCamFallback({
        icon: '🚫',
        title: '浏览器不支持摄像头 API',
        desc: '当前浏览器不支持 <code>getUserMedia</code>。请改用「📸 拍照识别」或扫码枪。',
        canRetry: false
      });
      return;
    }
    if (!HAS_JSQR) {
      showToast('二维码解码库未加载，无法使用摄像头', 'error');
      return;
    }

    // ---- 2) 打开遮罩 + 尝试获取流 ----
    camModal.classList.remove('hidden');
    camFallback.classList.add('hidden');
    camVideo.classList.remove('hidden');

    var stream = null;
    var lastErr = null;

    // 第一次：优先环境摄像头（后置）
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
    } catch (e) {
      lastErr = e;
      console.warn('[摄像头] environment 尝试失败:', e.name, e.message);
    }

    // 第二次：通用约束（部分设备对 ideal 敏感，或没有后置摄像头）
    if (!stream && lastErr) {
      // 权限被拒时不再重试，直接展示错误
      var name = lastErr.name || '';
      if (name !== 'NotAllowedError' && name !== 'PermissionDeniedError') {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
          lastErr = null;
        } catch (e2) {
          lastErr = e2;
          console.warn('[摄像头] 通用约束尝试失败:', e2.name, e2.message);
        }
      }
    }

    // ---- 3) 失败处理 ----
    if (!stream) {
      var info = explainCamError(lastErr);
      showCamFallback(info);
      return;
    }

    // ---- 4) 成功：绑定 video 并启动解码 ----
    state.camStream = stream;
    camVideo.srcObject = stream;
    try {
      await camVideo.play();
    } catch (e) {
      // 自动播放策略拒绝（罕见，muted 一般不会）
      console.warn('[摄像头] play() 失败:', e);
    }
    state.camDecoding = true;
    requestAnimationFrame(camDecodeFrame);
  }

  function camDecodeFrame() {
    if (!state.camDecoding) return;
    if (camVideo.readyState >= camVideo.HAVE_CURRENT_DATA) {
      var w = camVideo.videoWidth;
      var h = camVideo.videoHeight;
      if (w && h) {
        var maxDim = 1280;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var dw = Math.round(w * scale);
        var dh = Math.round(h * scale);
        if (camCanvas.width !== dw) camCanvas.width = dw;
        if (camCanvas.height !== dh) camCanvas.height = dh;
        var ctx = camCanvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(camVideo, 0, 0, dw, dh);
        try {
          var imageData = ctx.getImageData(0, 0, dw, dh);
          var code = jsQR(imageData.data, dw, dh, { inversionAttempts: 'dontInvert' });
          if (code && code.data) {
            stopCamera();
            handleScannedGid(code.data);
            return;
          }
        } catch (e) { /* 忽略单帧解码错误 */ }
      }
    }
    requestAnimationFrame(camDecodeFrame);
  }

  function stopCamera() {
    state.camDecoding = false;
    if (state.camStream) {
      try {
        state.camStream.getTracks().forEach(function (t) { t.stop(); });
      } catch (e) {}
      state.camStream = null;
    }
    camVideo.srcObject = null;
    camModal.classList.add('hidden');
    camFallback.classList.add('hidden');
    camVideo.classList.remove('hidden');
    camFallback.classList.add('hidden');
  }

  camClose.addEventListener('click', stopCamera);

  camFallbackPhoto.addEventListener('click', function () {
    stopCamera();
    btnPhoto.click();
  });

  camRetryBtn.addEventListener('click', function () {
    // 停止旧流（通常没有），重新尝试
    stopCamera();
    setTimeout(startCamera, 100);
  });

  /* ---------- 拍照识别 ---------- */
  function handlePhotoFile(file) {
    if (!HAS_JSQR) {
      showToast('二维码解码库未加载，无法识别图片', 'error');
      return;
    }
    if (!file) return;
    if (!/^image\//.test(file.type)) {
      showToast('请选择图片文件', 'error');
      return;
    }
    if (state.photoDecoding) return;
    state.photoDecoding = true;

    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        try {
          var maxDim = 1600;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));

          var c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          var ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, w, h);
          var imageData = ctx.getImageData(0, 0, w, h);

          var code = jsQR(imageData.data, w, h, { inversionAttempts: 'attemptBoth' });
          if (code && code.data) {
            handleScannedGid(code.data);
          } else {
            showToast('未能识别图片中的二维码，请重试或换个角度', 'error');
          }
        } catch (e) {
          showToast('图片处理失败：' + (e.message || e), 'error');
        } finally {
          state.photoDecoding = false;
        }
      };
      img.onerror = function () {
        state.photoDecoding = false;
        showToast('图片加载失败', 'error');
      };
      img.src = ev.target.result;
    };
    reader.onerror = function () {
      state.photoDecoding = false;
      showToast('图片读取失败', 'error');
    };
    reader.readAsDataURL(file);
  }

  /* ---------- 导出 / 清空 ---------- */
  function exportQueue() {
    if (!state.queue.length) { showToast('队列为空', 'error'); return; }
    var batchId = getOrCreateBatchId();
    var payload = {
      batch_id: batchId,
      exported_at: nowStr(),
      app_id: APP_ID,
      app_name: APP.name || APP_ID,
      client: 'scan-offline-single',
      scans: state.queue.map(function (r) {
        return {
          client_uuid: r.client_uuid,
          app_id: r.app_id,
          gid: r.gid,
          action_id: r.action_id,
          action_value: r.action_value,
          scanned_at: r.scanned_at,
          action_label: r.action_label,
        };
      }),
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)],
                        { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var ts = nowStr().replace(/[: ]/g, '-');
    a.href = url;
    a.download = batchId + '_' + ts + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    showToast('已导出 ' + state.queue.length + ' 条，请把文件拷回在线终端');
  }

  function clearQueue() {
    if (!state.queue.length) return;
    if (!confirm('确定清空本机队列？\n建议先导出 JSON 再清空。')) return;
    state.queue = [];
    saveQueue();
    renderQueue();
    resetBatchId();
    showToast('已清空');
  }

  /* ---------- 事件 ---------- */
  scanInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitScan(); }
  });
  btnSubmitScan.addEventListener('click', submitScan);
  btnCamera.addEventListener('click', startCamera);
  btnPhoto.addEventListener('click', function () {
    photoInput.value = '';
    photoInput.click();
  });
  photoInput.addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) handlePhotoFile(f);
  });
  btnExport.addEventListener('click', exportQueue);
  btnClear.addEventListener('click', clearQueue);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.camStream) stopCamera();
  });

  // 切后台时暂停解码，回前台再继续（省电）
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (state.camDecoding) {
        state.camDecoding = false;
        try { camVideo.pause(); } catch (e) {}
      }
    } else if (state.camStream && !state.camDecoding) {
      state.camDecoding = true;
      requestAnimationFrame(camDecodeFrame);
    }
  });

  /* ============================================================
   * ★ 全局键盘缓冲：焦点在任何地方都能扫
   * ------------------------------------------------------------
   * 原理：
   *   - scanInput 有焦点 → 由现有 keydown 处理（不动）
   *   - scanInput 没焦点 → 全局捕获按键，攒成缓冲
   *   - 键间隔 < 100ms 视为扫码枪（人类打字做不到这么快）
   *   - 遇回车且缓冲长度 >= 8 → 触发扫码
   *   - 500ms 无按键 → 缓冲自动清空（防止误攒）
   * ============================================================ */
  var _scanBuffer = '';
  var _lastKeyTime = 0;
  var _bufferTimer = null;

  document.addEventListener('keydown', function (e) {
    // 焦点在 scanInput 里 → 让它自己处理
    if (e.target === scanInput) return;

    // 修饰键组合不拦截
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    var now = Date.now();
    var gap = now - _lastKeyTime;

    // 回车：判断是否是扫码枪输入完成
    if (e.key === 'Enter') {
      if (_scanBuffer.length >= 8) {
        e.preventDefault();
        e.stopPropagation();
        var gid = _scanBuffer;
        _scanBuffer = '';
        clearTimeout(_bufferTimer);
        scanInput.value = gid;
        submitScan();
      }
      _lastKeyTime = now;
      return;
    }

    // 只处理可打印字符（长度 1）
    if (e.key.length !== 1) {
      _lastKeyTime = now;
      return;
    }

    // 间隔 > 100ms 视为人类输入，重新开始缓冲
    if (gap > 100) _scanBuffer = '';
    _scanBuffer += e.key;
    _lastKeyTime = now;

    // 500ms 无按键 → 清空缓冲（防止残留字符影响下次扫码）
    clearTimeout(_bufferTimer);
    _bufferTimer = setTimeout(function () { _scanBuffer = ''; }, 500);
  }, true);   // ★ capture 阶段拦截，先于按钮默认行为

  /* 任何点击后，都重新把焦点还给输入框（300ms 后） */
  document.addEventListener('click', function () {
    setTimeout(function () {
      if (document.activeElement !== scanInput) {
        try { scanInput.focus(); } catch (e) {}
      }
    }, 300);
  });

  /* ---------- 启动 ---------- */
  loadQueue();
  renderQueue();
  getOrCreateBatchId();

  // 禁用不可用的按钮
  if (!HAS_JSQR) {
    btnCamera.disabled = true;
    btnPhoto.disabled = true;
    btnCamera.title = '解码库未加载';
    btnPhoto.title = '解码库未加载';
  } else if (!env.camPossible) {
    // 摄像头必然不可用 → 不禁用（点击后仍能看到具体解释）
    btnCamera.title = '点击查看摄像头不可用的原因';
  }

  setTimeout(function () { scanInput.focus(); }, 100);
})();
</script>
