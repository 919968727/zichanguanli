<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 台账管理系统</title>
<link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    padding: 36px 32px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    border: 1px solid rgba(255, 255, 255, .6);
  }
  .login-card h2 {
    margin: 0 0 24px;
    text-align: center;
    font-size: 20px;
    color: var(--text);
    font-weight: 700;
  }
  .login-card .field { margin-bottom: 16px; }
  .login-card button[type="submit"] {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    margin-top: 4px;
  }
  #message, #regMessage {
    margin-top: 14px;
    min-height: 20px;
    text-align: center;
    font-size: 13px;
  }
  .success { color: var(--success); }
  .error { color: var(--danger); }
  .switch {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
  }
  .switch a { color: var(--primary); text-decoration: none; font-weight: 500; }
  .switch a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- 登录 -->
<div class="login-card" id="loginCard">
  <div class="auth-logo">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg>
  </div>
  <h2>台账管理系统</h2>
  <form id="loginForm">
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" type="text" placeholder="请输入用户名" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
    </div>
    <button id="submitBtn" type="submit">登录</button>
  </form>
  <div id="message"></div>
  <div class="switch">还没有账号？<a href="#" id="toRegister">注册账号</a></div>
</div>

<!-- 注册 -->
<div class="login-card hidden" id="registerCard">
  <div class="auth-logo">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <line x1="19" y1="8" x2="19" y2="14"/>
      <line x1="22" y1="11" x2="16" y2="11"/>
    </svg>
  </div>
  <h2>注册账号</h2>
  <form id="registerForm">
    <div class="field">
      <label for="regUsername">用户名</label>
      <input id="regUsername" type="text" placeholder="2-20 个字符" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="regPassword">密码</label>
      <input id="regPassword" type="password" placeholder="至少 4 位" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="regPassword2">确认密码</label>
      <input id="regPassword2" type="password" placeholder="再次输入密码" autocomplete="new-password" required>
    </div>
    <button id="regBtn" type="submit">提交注册</button>
  </form>
  <div id="regMessage"></div>
  <div class="switch">已有账号？<a href="#" id="toLogin">返回登录</a></div>
</div>

<script>
var CSRF = {{ csrf_token|tojson }};
(function () {
  'use strict';
  var loginCard = document.getElementById('loginCard');
  var registerCard = document.getElementById('registerCard');
  var loginForm = document.getElementById('loginForm');
  var registerForm = document.getElementById('registerForm');
  var messageEl = document.getElementById('message');
  var regMessageEl = document.getElementById('regMessage');
  var submitBtn = document.getElementById('submitBtn');
  var regBtn = document.getElementById('regBtn');

  function showMessage(el, text, type) {
    el.textContent = text;
    el.className = type || '';
  }

  document.getElementById('toRegister').addEventListener('click', function (e) {
    e.preventDefault();
    loginCard.classList.add('hidden');
    registerCard.classList.remove('hidden');
    showMessage(regMessageEl, '', '');
  });
  document.getElementById('toLogin').addEventListener('click', function (e) {
    e.preventDefault();
    registerCard.classList.add('hidden');
    loginCard.classList.remove('hidden');
    showMessage(messageEl, '', '');
  });

  loginForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    if (!username || !password) { showMessage(messageEl, '用户名和密码不能为空', 'error'); return; }
    submitBtn.disabled = true;
    showMessage(messageEl, '正在登录...', '');
    try {
      var res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify({ username: username, password: password })
      });
      var result = await res.json();
      if (res.ok && result.code === 0) {
        showMessage(messageEl, result.msg || '登录成功', 'success');
        setTimeout(function () { window.location.href = result.redirect || '/editor'; }, 400);
      } else {
        showMessage(messageEl, result.msg || '登录失败', 'error');
      }
    } catch (err) {
      showMessage(messageEl, '请求失败，请检查后端是否启动', 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });

  registerForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('regUsername').value.trim();
    var pwd = document.getElementById('regPassword').value;
    var pwd2 = document.getElementById('regPassword2').value;
    if (!username || !pwd) { showMessage(regMessageEl, '用户名和密码不能为空', 'error'); return; }
    if (pwd !== pwd2) { showMessage(regMessageEl, '两次密码不一致', 'error'); return; }
    regBtn.disabled = true;
    showMessage(regMessageEl, '正在提交...', '');
    try {
      var res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': CSRF },
        body: JSON.stringify({ username: username, password: pwd })
      });
      var result = await res.json();
      if (res.ok && result.code === 0) {
        showMessage(regMessageEl, result.msg || '注册成功，等待管理员审批', 'success');
        registerForm.reset();
        setTimeout(function () {
          registerCard.classList.add('hidden');
          loginCard.classList.remove('hidden');
          showMessage(messageEl, '请使用新账号登录（需等待审批）', '');
        }, 1600);
      } else {
        showMessage(regMessageEl, result.msg || '注册失败', 'error');
      }
    } catch (err) {
      showMessage(regMessageEl, '请求失败，请检查后端是否启动', 'error');
    } finally {
      regBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
